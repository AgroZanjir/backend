[project]
name = "agrozanjir-backend"
version = "0.1.0"
description = "Agro Zanjir Django API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1.1",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
    "anthropic==1.1.0",
    "redis>=6.4,<8",
]

[dependency-groups]
dev = ["coverage>=7.10,<8", "ruff>=0.14,<1"]

[tool.uv]
package = false
required-version = "==0.12.23"
exclude-newer = "7 days"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Catch syntax and undefined-name errors without restyling the existing app.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["apps", "ports"]
omit = ["*/migrations/*", "*/tests/*"]
